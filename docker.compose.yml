services:
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest-cu128
    ports:
      - "${KOKORO_PORT:-8880}:8880"
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 10s
      timeout: 5s
      retries: 3
