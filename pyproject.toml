[project]
name = "ai-tts-injector"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "audiosegment>=0.23.0",
    "customtkinter>=5.2.2",
    "enchant>=0.0.1",
    "easyocr",
    "fasttext-wheel>=0.9.2",
    "httpx>=0.28.1",
    "kb>=0.1.8",
    "keyboard>=0.13.5",
    "mouse>=0.7.1",
    "mss>=10.2.0",
    "nest-asyncio>=1.6.0",
    "numpy>=2.4.6",
    "openai>=2.44.0",
    "opencv-python>=4.13.0.92",
    "pyenchant>=3.3.0",
    "pygetwindow>=0.0.9",
    "pynput>=1.8.2",
    "pywin32>=312",
    "screeninfo>=0.8.1",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
    "toggle>=1.1.3",
    "websocket-client>=1.9.0",
    "torch",
    "torchvision",
    "torchaudio"
]

# TODO custom stuff for just dev environment vs production, cu128 is the one i personally need but it'll differ for others
# Gets specific cuda 128 files for my personal setup
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [ { index = "pytorch-cu128", marker = "sys_platform == 'win32'" } ]
torchvision = [ { index = "pytorch-cu128", marker = "sys_platform == 'win32'" } ]
torchaudio = [ { index = "pytorch-cu128", marker = "sys_platform == 'win32'" } ]